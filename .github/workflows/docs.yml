name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docc:
    name: DocC
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build DocC documentation
        run: >
          swift package generate-documentation
          --target MCPKit
          --warnings-as-errors
